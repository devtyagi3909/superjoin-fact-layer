<?xml version='1.0' encoding='utf-8'?>
<svg width="1020" height="640" viewBox="0 0 1020 640" xmlns="http://www.w3.org/2000/svg" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Outer Border / Card -->
  <rect x="15" y="15" width="990" height="610" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2" />

  <!-- HEADER -->
  <g transform="translate(40, 48)">
    <text x="0" y="0" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.5">FACT KNOWLEDGE LAYER · SYSTEM ARCHITECTURE</text>
    <text x="0" y="20" fill="#94a3b8" font-size="12">End-to-end evidence-first document intelligence pipeline for multi-filing reconciliation</text>
  </g>

  <!-- ==================== COLUMN 1: INGESTION & PREPROCESSING ==================== -->
  <g transform="translate(40, 95)">
    <!-- Stage Box Container -->
    <rect x="0" y="0" width="170" height="500" rx="8" fill="#111c35" stroke="#1e3a8a" stroke-width="1.5" />
    <rect x="0" y="0" width="170" height="32" rx="8" fill="#1e3a8a" />
    <rect x="0" y="20" width="170" height="12" fill="#1e3a8a" />
    <text x="85" y="21" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">1. INGESTION &amp; LAYOUT</text>

    <!-- Sub-box 1: Source Files -->
    <g transform="translate(12, 45)">
      <rect x="0" y="0" width="146" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="10" y="18" fill="#38bdf8" font-size="10" font-weight="700">Multi-PDF Input</text>
      <text x="10" y="34" fill="#cbd5e1" font-size="9">• 01-Prospectus (100p)</text>
      <text x="10" y="48" fill="#cbd5e1" font-size="9">• 02-Annual Report (100p)</text>
      <text x="10" y="62" fill="#cbd5e1" font-size="9">• 03-Q4 Deck (27p)</text>
      <text x="10" y="76" fill="#94a3b8" font-size="8">Format: PDF / Text streams</text>
    </g>

    <!-- Sub-box 2: Spatial Layout Engine -->
    <g transform="translate(12, 160)">
      <rect x="0" y="0" width="146" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="10" y="18" fill="#38bdf8" font-size="10" font-weight="700">Spatial Layout Engine</text>
      <text x="10" y="34" fill="#e2e8f0" font-size="9.5" font-weight="600">PyMuPDF / Docling</text>
      <text x="10" y="52" fill="#94a3b8" font-size="8.5">• 2D Bounding-Box Track</text>
      <text x="10" y="66" fill="#94a3b8" font-size="8.5">• Table Cell Reconstruction</text>
      <text x="10" y="80" fill="#94a3b8" font-size="8.5">• Authoritative Page Map</text>
      <text x="10" y="96" fill="#64748b" font-size="8">Prevents column interleaving</text>
    </g>

    <!-- Sub-box 3: Dynamic Chunk Budgeter -->
    <g transform="translate(12, 300)">
      <rect x="0" y="0" width="146" height="120" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="10" y="18" fill="#38bdf8" font-size="10" font-weight="700">Dynamic Chunk Budgeter</text>
      <text x="10" y="34" fill="#cbd5e1" font-size="9">• Adaptive page grouping</text>
      <text x="10" y="48" fill="#cbd5e1" font-size="9">• Strict prompt char budget</text>
      <text x="10" y="62" fill="#cbd5e1" font-size="9">• Prevents HTTP 413 &amp; 429</text>
      <text x="10" y="78" fill="#e2e8f0" font-size="9" font-weight="600">ThreadPoolExecutor</text>
      <text x="10" y="92" fill="#94a3b8" font-size="8">• Bounded concurrency (2w)</text>
      <text x="10" y="106" fill="#94a3b8" font-size="8">• Exponential backoff retries</text>
    </g>

    <!-- Connection lines inside Col 1 -->
    <line x1="85" y1="130" x2="85" y2="160" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="85" y1="270" x2="85" y2="300" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

  <!-- Pipeline Connector Col 1 -> Col 2 -->
  <line x1="210" y1="455" x2="245" y2="455" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 2: EXTRACTION & SCHEMA ==================== -->
  <g transform="translate(245, 95)">
    <!-- Stage Box Container -->
    <rect x="0" y="0" width="175" height="500" rx="8" fill="#181329" stroke="#581c87" stroke-width="1.5" />
    <rect x="0" y="0" width="175" height="32" rx="8" fill="#581c87" />
    <rect x="0" y="20" width="175" height="12" fill="#581c87" />
    <text x="87" y="21" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">2. EXTRACTION &amp; SCHEMA</text>

    <!-- Sub-box 1: Structured LLM Engine -->
    <g transform="translate(12, 45)">
      <rect x="0" y="0" width="151" height="95" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="10" y="18" fill="#a78bfa" font-size="10" font-weight="700">Extraction Engine</text>
      <text x="10" y="34" fill="#e2e8f0" font-size="9.5" font-weight="600">Instructor + Schema</text>
      <text x="10" y="50" fill="#cbd5e1" font-size="8.5">• Gemini 2.5 / Groq LLM</text>
      <text x="10" y="64" fill="#cbd5e1" font-size="8.5">• Structured JSON enforcement</text>
      <text x="10" y="78" fill="#cbd5e1" font-size="8.5">• Few-shot financial prompts</text>
      <text x="10" y="90" fill="#94a3b8" font-size="8">Extracts atomic statements</text>
    </g>

    <!-- Sub-box 2: Pydantic v2 Schema Gate -->
    <g transform="translate(12, 165)">
      <rect x="0" y="0" width="151" height="125" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="10" y="18" fill="#a78bfa" font-size="10" font-weight="700">Pydantic v2 Contract</text>
      <text x="10" y="34" fill="#cbd5e1" font-size="8.5">• subject: str (entity)</text>
      <text x="10" y="48" fill="#cbd5e1" font-size="8.5">• predicate: str (action)</text>
      <text x="10" y="62" fill="#cbd5e1" font-size="8.5">• value: float | str</text>
      <text x="10" y="76" fill="#cbd5e1" font-size="8.5">• unit: str (normalized)</text>
      <text x="10" y="90" fill="#cbd5e1" font-size="8.5">• temporal_scope: str</text>
      <text x="10" y="104" fill="#cbd5e1" font-size="8.5">• excerpt: verbatim</text>
      <text x="10" y="118" fill="#94a3b8" font-size="8">Zero untyped fact strings</text>
    </g>

    <!-- Sub-box 3: Grounding Verification Filter -->
    <g transform="translate(12, 315)">
      <rect x="0" y="0" width="151" height="110" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="10" y="18" fill="#a78bfa" font-size="10" font-weight="700">Grounding Verifier</text>
      <text x="10" y="34" fill="#cbd5e1" font-size="8.5">• Excerpt in source chunk?</text>
      <text x="10" y="48" fill="#cbd5e1" font-size="8.5">• Value in excerpt string?</text>
      <text x="10" y="62" fill="#cbd5e1" font-size="8.5">• Authoritative page match?</text>
      <text x="10" y="78" fill="#e2e8f0" font-size="8.5" font-weight="600">Confidence Score Calc</text>
      <text x="10" y="92" fill="#f87171" font-size="8">• Score &lt; 0.4 ➔ REJECT</text>
      <text x="10" y="104" fill="#4ade80" font-size="8">• Validated ➔ Ledger</text>
    </g>

    <!-- Connection lines inside Col 2 -->
    <line x1="87" y1="140" x2="87" y2="165" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="87" y1="290" x2="87" y2="315" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

  <!-- Pipeline Connector Col 2 -> Col 3 -->
  <line x1="420" y1="370" x2="455" y2="370" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 3: CANDIDATE PAIR RETRIEVAL ==================== -->
  <g transform="translate(455, 95)">
    <!-- Stage Box Container -->
    <rect x="0" y="0" width="175" height="500" rx="8" fill="#111f26" stroke="#0e7490" stroke-width="1.5" />
    <rect x="0" y="0" width="175" height="32" rx="8" fill="#0e7490" />
    <rect x="0" y="20" width="175" height="12" fill="#0e7490" />
    <text x="87" y="21" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">3. RETRIEVAL &amp; PRUNING</text>

    <!-- Sub-box 1: Inverted Lexical Index -->
    <g transform="translate(12, 45)">
      <rect x="0" y="0" width="151" height="95" rx="6" fill="#162e3b" stroke="#155e75" stroke-width="1" />
      <text x="10" y="18" fill="#22d3ee" font-size="10" font-weight="700">Inverted Lexical Index</text>
      <text x="10" y="34" fill="#cbd5e1" font-size="8.5">• Token dictionary index</text>
      <text x="10" y="48" fill="#cbd5e1" font-size="8.5">• Pre-filters pairing pool</text>
      <text x="10" y="62" fill="#cbd5e1" font-size="8.5">• Prevents O(N²) explosion</text>
      <text x="10" y="78" fill="#e2e8f0" font-size="9" font-weight="600">Complexity: O(N log N)</text>
      <text x="10" y="90" fill="#94a3b8" font-size="8">Discards unrelated facts</text>
    </g>

    <!-- Sub-box 2: Hybrid Similarity Matcher -->
    <g transform="translate(12, 165)">
      <rect x="0" y="0" width="151" height="120" rx="6" fill="#162e3b" stroke="#155e75" stroke-width="1" />
      <text x="10" y="18" fill="#22d3ee" font-size="10" font-weight="700">Hybrid Matcher Engine</text>
      <text x="10" y="34" fill="#e2e8f0" font-size="9" font-weight="600">1. RapidFuzz Token-Sort</text>
      <text x="10" y="48" fill="#cbd5e1" font-size="8">• Entity &amp; subject ratio</text>
      <text x="10" y="64" fill="#e2e8f0" font-size="9" font-weight="600">2. SentenceTransformer</text>
      <text x="10" y="78" fill="#cbd5e1" font-size="8">• Dense semantic vectors</text>
      <text x="10" y="92" fill="#cbd5e1" font-size="8">• Cosine similarity metric</text>
      <text x="10" y="108" fill="#94a3b8" font-size="8">Score &gt;= 0.75 ➔ Candidate</text>
    </g>

    <!-- Sub-box 3: Candidate Pairs Pool -->
    <g transform="translate(12, 315)">
      <rect x="0" y="0" width="151" height="110" rx="6" fill="#162e3b" stroke="#155e75" stroke-width="1" />
      <text x="10" y="18" fill="#22d3ee" font-size="10" font-weight="700">Candidate Pairs Pool</text>
      <text x="10" y="34" fill="#cbd5e1" font-size="8.5">• Cross-doc candidates only</text>
      <text x="10" y="48" fill="#cbd5e1" font-size="8.5">• Bounded top-K per metric</text>
      <text x="10" y="64" fill="#4ade80" font-size="9" font-weight="600">Space Reduction:</text>
      <text x="10" y="78" fill="#94a3b8" font-size="8.5">1,000,000 pairs ➔ 14 pairs</text>
      <text x="10" y="98" fill="#38bdf8" font-size="8.5">Enables instant traversal</text>
    </g>

    <!-- Connection lines inside Col 3 -->
    <line x1="87" y1="140" x2="87" y2="165" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="87" y1="285" x2="87" y2="315" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

  <!-- Pipeline Connector Col 3 -> Col 4 -->
  <line x1="630" y1="370" x2="665" y2="370" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 4: DETERMINISTIC GATES ==================== -->
  <g transform="translate(665, 95)">
    <!-- Stage Box Container -->
    <rect x="0" y="0" width="165" height="500" rx="8" fill="#211812" stroke="#9a3412" stroke-width="1.5" />
    <rect x="0" y="0" width="165" height="32" rx="8" fill="#9a3412" />
    <rect x="0" y="20" width="165" height="12" fill="#9a3412" />
    <text x="82" y="21" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">4. GATES &amp; REASONING</text>

    <!-- Sub-box 1: Unit Canonicalizer -->
    <g transform="translate(10, 45)">
      <rect x="0" y="0" width="145" height="95" rx="6" fill="#2d1c13" stroke="#7c2d12" stroke-width="1" />
      <text x="8" y="18" fill="#fb923c" font-size="10" font-weight="700">Unit Canonicalizer</text>
      <text x="8" y="34" fill="#cbd5e1" font-size="8.5">• ₹ Mn ➔ 10⁶ INR</text>
      <text x="8" y="48" fill="#cbd5e1" font-size="8.5">• ₹ Cr ➔ 10⁷ INR</text>
      <text x="8" y="62" fill="#cbd5e1" font-size="8.5">• ₹81,415M ➔ ₹8,141.5Cr</text>
      <text x="8" y="78" fill="#4ade80" font-size="8.5" font-weight="600">Zero LLM tokens needed</text>
      <text x="8" y="90" fill="#94a3b8" font-size="8">Deterministic unit match</text>
    </g>

    <!-- Sub-box 2: Contextual Scope Gate -->
    <g transform="translate(10, 165)">
      <rect x="0" y="0" width="145" height="110" rx="6" fill="#2d1c13" stroke="#7c2d12" stroke-width="1" />
      <text x="8" y="18" fill="#fb923c" font-size="10" font-weight="700">Scope &amp; Period Gate</text>
      <text x="8" y="34" fill="#cbd5e1" font-size="8.5">• Fiscal year vs Quarter</text>
      <text x="8" y="48" fill="#cbd5e1" font-size="8.5">• Spoton inclusion scope</text>
      <text x="8" y="62" fill="#cbd5e1" font-size="8.5">• EBITDA vs PAT scope</text>
      <text x="8" y="78" fill="#f59e0b" font-size="8.5" font-weight="600">Accounting Ontology:</text>
      <text x="8" y="92" fill="#94a3b8" font-size="8">Bridges operating profit to</text>
      <text x="8" y="104" fill="#94a3b8" font-size="8">statutory bottom line</text>
    </g>

    <!-- Sub-box 3: LLM Adjudicator -->
    <g transform="translate(10, 305)">
      <rect x="0" y="0" width="145" height="115" rx="6" fill="#2d1c13" stroke="#7c2d12" stroke-width="1" />
      <text x="8" y="18" fill="#fb923c" font-size="10" font-weight="700">LLM Reasoning Router</text>
      <text x="8" y="34" fill="#cbd5e1" font-size="8.5">• Receives unresolved pairs</text>
      <text x="8" y="48" fill="#cbd5e1" font-size="8.5">• Validates claim divergence</text>
      <text x="8" y="62" fill="#cbd5e1" font-size="8.5">• Generates natural explanation</text>
      <text x="8" y="78" fill="#4ade80" font-size="8.5" font-weight="600">Strict Classification:</text>
      <text x="8" y="92" fill="#94a3b8" font-size="8">• Genuine Contradiction</text>
      <text x="8" y="104" fill="#94a3b8" font-size="8">• Contextual Reconciliation</text>
    </g>

    <!-- Connection lines inside Col 4 -->
    <line x1="82" y1="140" x2="82" y2="165" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="82" y1="275" x2="82" y2="305" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

  <!-- Pipeline Connector Col 4 -> Col 5 -->
  <line x1="830" y1="365" x2="865" y2="365" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 5: KNOWLEDGE GRAPH & UI ==================== -->
  <g transform="translate(865, 95)">
    <!-- Stage Box Container -->
    <rect x="0" y="0" width="115" height="500" rx="8" fill="#0f231c" stroke="#047857" stroke-width="1.5" />
    <rect x="0" y="0" width="115" height="32" rx="8" fill="#047857" />
    <rect x="0" y="20" width="115" height="12" fill="#047857" />
    <text x="57" y="21" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">5. KNOWLEDGE GRAPH</text>

    <!-- Topologies Sub-boxes -->
    <g transform="translate(8, 45)">
      <rect x="0" y="0" width="99" height="75" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <text x="8" y="16" fill="#34d399" font-size="9" font-weight="700">1. Corroborate</text>
      <text x="8" y="30" fill="#ffffff" font-size="8">₹81,415M = ₹8,142Cr</text>
      <text x="8" y="44" fill="#a7f3d0" font-size="7.5">Same scope &amp; metric</text>
      <text x="8" y="58" fill="#a7f3d0" font-size="7.5">0.006% unit match</text>
      <text x="8" y="70" fill="#6ee7b7" font-size="7" font-weight="bold">[Green Edge]</text>
    </g>

    <g transform="translate(8, 135)">
      <rect x="0" y="0" width="99" height="75" rx="5" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
      <text x="8" y="16" fill="#f87171" font-size="9" font-weight="700">2. Contradict</text>
      <text x="8" y="30" fill="#ffffff" font-size="8">Customers FY22</text>
      <text x="8" y="44" fill="#fca5a5" font-size="7.5">23,113 vs 23,613</text>
      <text x="8" y="58" fill="#fca5a5" font-size="7.5">Inclusion mismatch</text>
      <text x="8" y="70" fill="#f87171" font-size="7" font-weight="bold">[Red Edge]</text>
    </g>

    <g transform="translate(8, 225)">
      <rect x="0" y="0" width="99" height="75" rx="5" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
      <text x="8" y="16" fill="#fbbf24" font-size="9" font-weight="700">3. Contextual</text>
      <text x="8" y="30" fill="#ffffff" font-size="8">EBITDA vs PAT</text>
      <text x="8" y="44" fill="#fde68a" font-size="7.5">+1,266M vs -2,491M</text>
      <text x="8" y="58" fill="#fde68a" font-size="7.5">Bridged by D&amp;A</text>
      <text x="8" y="70" fill="#fbbf24" font-size="7" font-weight="bold">[Amber Edge]</text>
    </g>

    <g transform="translate(8, 315)">
      <rect x="0" y="0" width="99" height="75" rx="5" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
      <text x="8" y="16" fill="#cbd5e1" font-size="9" font-weight="700">4. Failure</text>
      <text x="8" y="30" fill="#ffffff" font-size="8">Note 32 Table</text>
      <text x="8" y="44" fill="#94a3b8" font-size="7.5">Low conf (0.32)</text>
      <text x="8" y="58" fill="#94a3b8" font-size="7.5">Rejected at gate</text>
      <text x="8" y="70" fill="#94a3b8" font-size="7" font-weight="bold">[Grey Node]</text>
    </g>

    <!-- Interfaces -->
    <g transform="translate(8, 405)">
      <rect x="0" y="0" width="99" height="75" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="8" y="16" fill="#38bdf8" font-size="8.5" font-weight="700">Interfaces</text>
      <text x="8" y="32" fill="#cbd5e1" font-size="8">• FastAPI (/facts)</text>
      <text x="8" y="46" fill="#cbd5e1" font-size="8">• NetworkX Graph</text>
      <text x="8" y="60" fill="#cbd5e1" font-size="8">• Streamlit UI</text>
      <text x="8" y="70" fill="#94a3b8" font-size="7">Direct Evidence</text>
    </g>
  </g>
</svg>
