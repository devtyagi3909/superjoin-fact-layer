<?xml version='1.0' encoding='utf-8'?>
<svg width="920" height="520" viewBox="0 0 920 520" xmlns="http://www.w3.org/2000/svg" style="background: radial-gradient(circle at 50% 30%, #0d1527 0%, #060911 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-amber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="p1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="p2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0c1e4a" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="p3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#190624" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="p4-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="beam-vertical" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes floatLayer0 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes floatLayer1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatLayer2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatLayer3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-11px); }
    }

    @keyframes pulseBeam {
      0% { stroke-dashoffset: 200; opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }

    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.18); opacity: 1; }
    }

    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(50px); opacity: 0.2; }
    }

    .layer-0 { animation: floatLayer0 5s ease-in-out infinite; }
    .layer-1 { animation: floatLayer1 5s ease-in-out infinite 0.4s; }
    .layer-2 { animation: floatLayer2 5s ease-in-out infinite 0.8s; }
    .layer-3 { animation: floatLayer3 5s ease-in-out infinite 1.2s; }

    .pulse-line {
      stroke-dasharray: 20, 10;
      animation: pulseBeam 2.5s linear infinite;
    }

    .node-anim {
      transform-origin: center;
      animation: pulseNode 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Isometric Grid Lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="260" x2="460" y2="440" />
    <line x1="460" y1="440" x2="820" y2="260" />
    <line x1="820" y1="260" x2="460" y2="80" />
    <line x1="460" y1="80" x2="100" y2="260" />
  </g>

  <!-- 3D VERTICAL CONNECTOR PILLARS -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.35">
    <line x1="240" y1="410" x2="240" y2="170" stroke-dasharray="4,4" />
    <line x1="460" y1="490" x2="460" y2="250" stroke-dasharray="4,4" />
    <line x1="680" y1="410" x2="680" y2="170" stroke-dasharray="4,4" />
    <line x1="460" y1="330" x2="460" y2="90" stroke-dasharray="4,4" />
  </g>

  <!-- ==================== LAYER 1: INGESTION PLANE (BOTTOM) ==================== -->
  <g class="layer-0" transform="translate(0, 40)">
    <!-- 3D Slab Thickness -->
    <polygon points="230,420 460,495 460,505 230,430" fill="#090d16" />
    <polygon points="460,495 690,420 690,430 460,505" fill="#04070d" />
    
    <!-- Top Face -->
    <polygon points="460,345 690,420 460,495 230,420" fill="url(#p1-grad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Content / Documents -->
    <g transform="translate(460, 420)">
      <!-- Card 1: Prospectus -->
      <polygon points="-110,-20 -50,-40 -20,-25 -80,-5" fill="#1e293b" stroke="#60a5fa" stroke-width="1" />
      <text x="-65" y="-18" fill="#93c5fd" font-size="9" font-weight="bold" text-anchor="middle">PROSPECTUS</text>
      
      <!-- Card 2: Annual Report -->
      <polygon points="-30,-5 30,-25 60,-10 0,10" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="15" y="-3" fill="#bae6fd" font-size="9" font-weight="bold" text-anchor="middle">ANNUAL REPORT</text>

      <!-- Card 3: Q4 Deck -->
      <polygon points="50,10 110,-10 140,5 80,25" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="95" y="12" fill="#c7d2fe" font-size="9" font-weight="bold" text-anchor="middle">Q4 EARNINGS</text>
    </g>

    <!-- Stage Label Badge -->
    <g transform="translate(710, 425)">
      <rect x="0" y="-12" width="180" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="5" fill="#94a3b8" font-size="11" font-weight="700">STAGE 1: FILE INGESTION</text>
      <text x="12" y="24" fill="#64748b" font-size="9">Multi-Filing PDF Corpus</text>
    </g>
  </g>

  <!-- ==================== LAYER 2: SPATIAL LAYOUT & PARSER (MID-LOW) ==================== -->
  <g class="layer-1" transform="translate(0, -30)">
    <!-- 3D Slab Thickness -->
    <polygon points="230,340 460,415 460,424 230,349" fill="#06122c" />
    <polygon points="460,415 690,340 690,349 460,424" fill="#020817" />
    
    <!-- Top Face -->
    <polygon points="460,265 690,340 460,415 230,340" fill="url(#p2-grad)" stroke="#1d4ed8" stroke-width="1.5" />
    
    <!-- Grid Scanning Bounding Boxes -->
    <g stroke="#38bdf8" stroke-width="1" fill="rgba(56, 189, 248, 0.08)" opacity="0.85">
      <polygon points="340,320 400,300 420,310 360,330" />
      <polygon points="480,340 550,315 580,330 510,355" />
      <polygon points="410,360 470,340 490,350 430,370" />
    </g>

    <!-- Scanning beam ray -->
    <line x1="320" y1="315" x2="600" y2="335" stroke="#38bdf8" stroke-width="2" filter="url(#glow-cyan)" opacity="0.7" />

    <!-- Stage Label Badge -->
    <g transform="translate(710, 345)">
      <rect x="0" y="-12" width="180" height="26" rx="6" fill="#0c1e4a" stroke="#1d4ed8" stroke-width="1" />
      <text x="12" y="5" fill="#60a5fa" font-size="11" font-weight="700">STAGE 2: SPATIAL ENGINE</text>
      <text x="12" y="24" fill="#64748b" font-size="9">Docling 2D Bounding Boxes</text>
    </g>
  </g>

  <!-- ==================== LAYER 3: CANDIDATE PAIRING & DEDUPLICATION (MID-HIGH) ==================== -->
  <g class="layer-2" transform="translate(0, -100)">
    <!-- 3D Slab Thickness -->
    <polygon points="230,260 460,335 460,344 230,269" fill="#1b0726" />
    <polygon points="460,335 690,260 690,269 460,344" fill="#0d0214" />
    
    <!-- Top Face -->
    <polygon points="460,185 690,260 460,335 230,260" fill="url(#p3-grad)" stroke="#a855f7" stroke-width="1.5" />

    <!-- Inverted Index & Semantic Web Nodes -->
    <g transform="translate(460, 260)">
      <!-- Connections -->
      <line x1="-80" y1="-10" x2="-20" y2="15" stroke="#c084fc" stroke-width="1.5" opacity="0.6" />
      <line x1="-20" y1="15" x2="60" y2="-15" stroke="#c084fc" stroke-width="1.5" opacity="0.6" />
      <line x1="60" y1="-15" x2="30" y2="25" stroke="#c084fc" stroke-width="1.5" opacity="0.6" />

      <!-- Nodes -->
      <circle cx="-80" cy="-10" r="5" fill="#e9d5ff" stroke="#a855f7" stroke-width="2" />
      <circle cx="-20" cy="15" r="7" fill="#c084fc" stroke="#f3e8ff" stroke-width="2" />
      <circle cx="60" cy="-15" r="6" fill="#e9d5ff" stroke="#a855f7" stroke-width="2" />
      <circle cx="30" cy="25" r="5" fill="#c084fc" stroke="#f3e8ff" stroke-width="2" />

      <!-- Math Label -->
      <text x="-120" y="20" fill="#e879f9" font-size="10" font-weight="700">O(N log N) Index</text>
      <text x="80" y="25" fill="#e879f9" font-size="10" font-weight="700">RapidFuzz + Embed</text>
    </g>

    <!-- Stage Label Badge -->
    <g transform="translate(710, 265)">
      <rect x="0" y="-12" width="180" height="26" rx="6" fill="#240733" stroke="#a855f7" stroke-width="1" />
      <text x="12" y="5" fill="#c084fc" font-size="11" font-weight="700">STAGE 3: RETRIEVAL INDEX</text>
      <text x="12" y="24" fill="#64748b" font-size="9">Inverted Lexical + Cosine Match</text>
    </g>
  </g>

  <!-- ==================== LAYER 4: RELATIONAL KNOWLEDGE GRAPH (TOP) ==================== -->
  <g class="layer-3" transform="translate(0, -170)">
    <!-- 3D Slab Thickness -->
    <polygon points="230,180 460,255 460,266 230,191" fill="#042017" />
    <polygon points="460,255 690,180 690,191 460,266" fill="#01130d" />
    
    <!-- Top Face -->
    <polygon points="460,105 690,180 460,255 230,180" fill="url(#p4-grad)" stroke="#10b981" stroke-width="2" />

    <!-- 3D KNOWLEDGE GRAPH NODES & EDGES -->
    <g transform="translate(460, 180)">
      <!-- Edge 1: Corroboration (Green Glowing Line) -->
      <line x1="-120" y1="-10" x2="-20" y2="-40" stroke="#10b981" stroke-width="3" filter="url(#glow-green)" />
      
      <!-- Edge 2: Contradiction (Red Glowing Line) -->
      <line x1="-20" y1="-40" x2="100" y2="-10" stroke="#ef4444" stroke-width="3" filter="url(#glow-red)" />

      <!-- Edge 3: Contextual (Amber Dashed Line) -->
      <line x1="-20" y1="-40" x2="0" y2="35" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,4" filter="url(#glow-amber)" />

      <!-- Node A: Revenue 81415 Mn (Corroborated) -->
      <g transform="translate(-120, -10)">
        <circle cx="0" cy="0" r="14" fill="#065f46" stroke="#34d399" stroke-width="2.5" class="node-anim" />
        <text x="0" y="4" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">₹ Mn</text>
        <text x="0" y="-18" fill="#6ee7b7" font-size="10" font-weight="700" text-anchor="middle">₹81,415M</text>
      </g>

      <!-- Node B: Revenue 8142 Cr (Corroborated) -->
      <g transform="translate(-20, -40)">
        <circle cx="0" cy="0" r="16" fill="#065f46" stroke="#34d399" stroke-width="2.5" class="node-anim" />
        <text x="0" y="4" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">₹ Cr</text>
        <text x="0" y="-22" fill="#6ee7b7" font-size="10" font-weight="700" text-anchor="middle">₹8,142 Cr</text>
      </g>

      <!-- Node C: Active Customers 23113 vs 23613 (Contradiction) -->
      <g transform="translate(100, -10)">
        <circle cx="0" cy="0" r="14" fill="#7f1d1d" stroke="#f87171" stroke-width="2.5" class="node-anim" />
        <text x="0" y="4" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Δ</text>
        <text x="0" y="-18" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">CONTRADICT</text>
      </g>

      <!-- Node D: PAT Loss vs EBITDA (Contextual) -->
      <g transform="translate(0, 35)">
        <circle cx="0" cy="0" r="13" fill="#78350f" stroke="#fbbf24" stroke-width="2.5" class="node-anim" />
        <text x="0" y="4" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Ctx</text>
        <text x="0" y="24" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">EBITDA / PAT</text>
      </g>
    </g>

    <!-- Stage Label Badge -->
    <g transform="translate(710, 185)">
      <rect x="0" y="-12" width="180" height="26" rx="6" fill="#042017" stroke="#10b981" stroke-width="1" />
      <text x="12" y="5" fill="#34d399" font-size="11" font-weight="700">STAGE 4: KNOWLEDGE GRAPH</text>
      <text x="12" y="24" fill="#64748b" font-size="9">NetworkX Reconciliation Matrix</text>
    </g>
  </g>

  <!-- Title & Legend Header in SVG -->
  <g transform="translate(30, 40)">
    <text x="0" y="0" fill="#f8fafc" font-size="15" font-weight="800" letter-spacing="1">MULTI-STAGE FACT KNOWLEDGE LAYER</text>
    <text x="0" y="18" fill="#64748b" font-size="11">Spatial Parsing • Bounded Retrieval • Deterministic Gates • Knowledge Graph</text>
  </g>

  <!-- Interactive Legend Indicators -->
  <g transform="translate(30, 480)">
    <circle cx="0" cy="0" r="5" fill="#10b981" filter="url(#glow-green)" />
    <text x="12" y="4" fill="#cbd5e1" font-size="11" font-weight="600">Corroborated Fact</text>

    <circle cx="160" cy="0" r="5" fill="#ef4444" filter="url(#glow-red)" />
    <text x="172" y="4" fill="#cbd5e1" font-size="11" font-weight="600">Genuine Contradiction</text>

    <circle cx="340" cy="0" r="5" fill="#f59e0b" filter="url(#glow-amber)" />
    <text x="352" y="4" fill="#cbd5e1" font-size="11" font-weight="600">Contextual Reconciliation</text>

    <circle cx="530" cy="0" r="5" fill="#a855f7" />
    <text x="542" y="4" fill="#cbd5e1" font-size="11" font-weight="600">O(N log N) Semantic Matrix</text>
  </g>
</svg>
